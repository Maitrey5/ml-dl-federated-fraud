[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower-fraud-detection"
version = "0.1.0"
description = "Federated fraud detection using Logistic Regression and Flower"
requires-python = ">=3.12"

dependencies = [
    "flwr==1.37.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "scikit-learn==1.9.1",
    "imbalanced-learn==0.14.2",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "xgboost==3.4.1",
    "pyyaml==6.0.3"
]

[tool.flwr.app]
publisher = "iitm"

[tool.flwr.app.components]
serverapp = "flower_app.server_app:app"
clientapp = "flower_app.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5

